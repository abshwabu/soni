# ==============================================================================
# Soni Perfume — Supervisor Worker Configuration
# Dedicated worker for the isolated SQLite queue connection (queue_db)
# ==============================================================================

[program:soni-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/soni-perfume/current/artisan queue:work queue_db --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/soni-perfume/shared/storage/logs/supervisor-queue.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600
priority=999
