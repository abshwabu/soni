# ==============================================================================
# Soni Perfume — Production Nginx Configuration
# Hardened for Laravel 11 + SQLite + Inertia.js + Filament v3
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name soniperfume.com www.soniperfume.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name soniperfume.com www.soniperfume.com;

    # Document Root (points to zero-downtime symlink)
    root /var/www/soni-perfume/current/public;
    index index.php index.html;

    # Charset
    charset utf-8;

    # SSL Configuration (Certbot paths)
    ssl_certificate /etc/letsencrypt/live/soniperfume.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soniperfume.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Upload size limit (for high-res perfume images in Filament admin)
    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ==========================================================================
    # SECURITY HARDENING: Deny direct access to SQLite, env, git, and backups
    # ==========================================================================
    location ~* \.(sqlite|sqlite3|db|wal|shm|bak|gz|sql|env)$ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Static Assets & Long-Term Caching
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg|css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Main application routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Custom Error Pages
    error_page 404 /index.php;

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Mitigate httpoxy vulnerability
        fastcgi_param HTTP_PROXY "";

        # FastCGI buffer tuning
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120s;
    }

    # Logging
    access_log /var/log/nginx/soni_access.log combined;
    error_log /var/log/nginx/soni_error.log warn;
}
